name: Advanced Build & Release
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  RELEASE_TAG: "v2026.10.29-1820"

jobs:
  # ==========================================
  # 🛡️ Level 3: Automated Testing (Linting)
  # ==========================================
  test-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linting Tools
        run: pip install flake8
      - name: Run Code Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Linting finished with warnings."

  # ==========================================
  # 📱 Level 2 & 4: Build Android (Native Setup)
  # ==========================================
  build-android:
    needs: test-code
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      # ✅ الحل النهائي: تثبيت كل المتطلبات مباشرة بدون Docker أو PPA معطوب
      - name: Setup Dependencies & Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          
      - name: Install Buildozer & Cython
        run: |
          pip3 install --user --upgrade buildozer Cython virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          buildozer android debug

      - name: Upload Artifact (For immediate download)
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk-artifact
          path: bin/*.apk

      # 🏆 Level 2: Create a GitHub Release automatically
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: "Automated build generated by Jarvis System."
          files: bin/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

