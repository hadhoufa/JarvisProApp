name: Advanced Build & Release
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 🔐 صلاحية ضرورية لإنشاء الإصدارات (Releases) تلقائياً
permissions:
  contents: write

env:
  RELEASE_TAG: "v2026.10.29-1824"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  # ==========================================
  # 🛡️ Automated Testing (Linting)
  # ==========================================
  test-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linting Tools
        run: pip install flake8
      - name: Run Code Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Linting finished with warnings."

  # ==========================================
  # 📱 Build Android (Native + Clean)
  # ==========================================
  build-android:
    needs: test-code
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      # 🧹 Auto Clean: تنظيف مساحة العمل قبل البدء
      - name: 🧹 Auto Clean Workspace
        run: |
          echo "Cleaning up old build artifacts..."
          rm -rf .buildozer bin/ build/ __pycache__/
          df -h

      # ✅ تثبيت المتطلبات و Java 17 (بدون PPA معطوب)
      - name: Setup Dependencies & Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          
      - name: Install Buildozer & Cython
        run: |
          pip3 install --user --upgrade buildozer Cython virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 💾 Smart Cache: تسريع البناء
      - name: 💾 Cache Buildozer Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          buildozer android debug

      - name: Upload Artifact (For immediate download)
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk-artifact
          path: bin/*.apk

      # 🏆 Create a GitHub Release automatically (جلب الإصدار تلقائياً)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: "Automated build generated by Jarvis System."
          files: bin/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      # 🧹 Post-Build Clean: تنظيف بعد البناء
      - name: 🧹 Post-Build Cleanup
        if: always() 
        run: |
          echo "Cleaning up temporary files..."
          rm -rf .buildozer bin/ build/
          df -h

