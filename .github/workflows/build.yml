name: Advanced Build & Release
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  RELEASE_TAG: "v2026.10.29-1717"

jobs:
  # ==========================================
  # 🛡️ Level 3: Automated Testing (Linting)
  # ==========================================
  test-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linting Tools
        run: pip install flake8
      - name: Run Code Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Linting finished with warnings."

  # ==========================================
  # 📱 Level 2 & 4: Build Android (Stable Docker)
  # ==========================================
  build-android:
    needs: test-code
    runs-on: ubuntu-22.04 # تم التثبيت لتجنب مشاكل الإصدارات
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Upload Artifact (For immediate download)
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk-artifact
          path: bin/*.apk

      # 🏆 Level 2: Create a GitHub Release automatically
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: "Automated build generated by Jarvis System."
          files: bin/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # 💻 Level 4: Build Windows (Optional/Future)
  # ==========================================
  # (Commented out by default to save GitHub Actions minutes)
  # build-windows:
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build Windows EXE
  #       run: echo "Add PyInstaller or Windows build steps here..."
