name: Advanced Build & Release
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  RELEASE_TAG: "v2026.10.29-1726"

jobs:
  # ==========================================
  # 🛡️ Level 3: Automated Testing (Linting)
  # ==========================================
  test-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linting Tools
        run: pip install flake8
      - name: Run Code Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Linting finished with warnings."

  # ==========================================
  # 📱 Level 2 & 4: Build Android (Stable Docker)
  # ==========================================
  build-android:
    needs: test-code
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      # ✅ الحل النهائي: تثبيت Java 17 يدوياً لتجاوز مستودع PPA المعطوب
      - name: Install Java 17 (Workaround for PPA error)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          
      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload Artifact (For immediate download)
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk-artifact
          path: bin/*.apk

      # 🏆 Level 2: Create a GitHub Release automatically
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: "Automated build generated by Jarvis System."
          files: bin/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

