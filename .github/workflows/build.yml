name: Build APK
on: [push, workflow_dispatch]

env:
  RELEASE_TAG: "v2026.10.29-1953"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK (Direct Docker - No Root Prompt)
        run: |
          docker run --rm -v "${{ github.workspace }}":/app -w /app             -e BUILDOZER_WARN_ON_ROOT=0             -e APP_ANDROID_ACCEPT_SDK_LICENSE=1             kivy/buildozer:latest bash -c "
              sudo rm -f /etc/apt/sources.list.d/openjdk-r-ppa*.list
              sudo apt-get update || true
              sudo apt-get install -y openjdk-17-jdk
              buildozer android debug
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: bin/*.apk
