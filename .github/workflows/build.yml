name: Advanced Build & Release
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  RELEASE_TAG: "v2026.10.29-1941"

jobs:
  test-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Linting finished with warnings."

  build-android:
    needs: test-code
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable # استخدام الإصدار المستقر بدلاً من master

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk-artifact
          path: bin/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: "Automated build generated by Jarvis System."
          files: bin/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
