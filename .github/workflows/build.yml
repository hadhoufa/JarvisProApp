name: Final Real Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk lib32stdc++6 lib32z1 lib32ncurses6 libltdl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip==23.3.2
          pip install cython==0.29.34
          pip install buildozer
      - name: Fix Permissions
        run: |
          chmod -R u+w .
          mkdir -p .buildozer
          chmod -R 777 .buildozer
      - name: Build APK
        run: buildozer android debug
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
