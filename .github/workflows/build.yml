name: Build APK
on: [push]
permissions:
  contents: write
jobs:
  build:
    # Changed to 20.04 to fix Java 8 and PPA missing errors
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        uses: digreatbrian/buildozer-action@v2
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          # Use direct path to avoid bad substitution error
          path: bin/*.apk
